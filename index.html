<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo List</title><script defer="defer" src="main.js"></script></head><body><header class="app-header"><h1>My task</h1><div id="btn"><button id="homeBtn">HOME</button> <button id="completedTask">COMPLIED TASK</button> <button id="incompleteTask">INCOMPLETE TASK</button> <button id="addBtn">ADD NEW TASK</button></div></header><main id="todoContant"></main><div id="dialogDiv"><dialog id="dialog"><form method="dialog" id="todoForm"><div class="form-group"><label for="title">Add Title</label> <input name="title" id="title" placeholder="Add Title.... " required></div><div class="form-group"><label for="info">Add Details</label> <input id="info" name="info" placeholder="Task..." required></div><div class="form-group"><label for="dueDate">The Completion time</label> <input type="datetime-local" name="dueDate" id="dueDate"></div><div class="dialog-actions"><button type="submit" id="saveBtn">Add Task</button> <button type="button" id="cancelBtn">Cancel</button></div></form></dialog></div></body></html>
